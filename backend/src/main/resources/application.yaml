spring:
  config:
    # `.env` has no extension, so Spring needs the properties format hint.
    # The file remains optional for production, where real environment variables
    # can be supplied by Docker, Kubernetes, or the host system.
    import: optional:file:./.env[.properties]

  application:
    name: Postflow.io

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # flyway config
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # redis config
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms          # timeout connexion — évite de bloquer si Redis est down
      lettuce:
        pool:
          max-active: 8        # connexions actives max
          max-idle: 4          # connexions inactives max
          min-idle: 1          # connexions inactives min (warm pool)
          max-wait: 1000ms

  # Mail server configuration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true    # chiffrement TLS obligatoire

app:
  base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  rate-limit:
    global:
      max-requests: ${RATE_LIMIT_GLOBAL:100}
    auth:
      max-requests: ${RATE_LIMIT_AUTH:10}
jwt:
  private-key-path: classpath:keys/private.pem
  public-key-path: classpath:keys/public.pem


server:
  port: ${SERVER_PORT:8080}
